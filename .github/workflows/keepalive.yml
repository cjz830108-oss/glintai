name: Supabase keepalive
# Keeps the free-tier Supabase project from auto-pausing after 7 days of
# inactivity. The job pings the DB every 6h through the Vercel proxy
# (https://glintai.tools/api/sb), which forwards to Supabase from an
# overseas edge node and counts as real database activity.
# The anon key is public by design (row-level security protects data),
# so it is safe to embed here.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase via Vercel proxy
        run: |
          curl -s -o /dev/null -w "keepalive HTTP %{http_code}\n" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml4aWR6bXB2bXljdmJ0Ymtob3h6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTMwMDUsImV4cCI6MjEwMTU4OTAwNX0.YFNC0chB9fcUPqys93y2k89BRb0B6_RNt8dfoAOLINo" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml4aWR6bXB2bXljdmJ0Ymtob3h6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTMwMDUsImV4cCI6MjEwMTU4OTAwNX0.YFNC0chB9fcUPqys93y2k89BRb0B6_RNt8dfoAOLINo" \
            "https://glintai.tools/api/sb?_path=/rest/v1/novels&select=id&limit=1"
